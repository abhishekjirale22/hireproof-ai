[project]
name = "hireproof-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.4,<3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
    "pwdlib[argon2]>=0.2",
    "python-jose[cryptography]>=3.3",
    "mutagen>=1.47",
    "email-validator>=2.2",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python build_frontend.py"
